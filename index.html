    <h1>Unified Inbox Lab</h1>
    <p class="lead">一个仅供项目所有者个人使用的本地统一邮件管理实验工具。</p>
    <section>
      <h2>用途</h2>
      <p>本工具在所有者自己的电脑上连接其主动授权的邮箱，用于验证邮件同步、搜索、会话整理和安全操作流程。它不是面向公众提供的在线邮件服务。</p>
    </section>
    <section>
      <h2>Google 数据使用</h2>
      <p>只有在所有者明确授权后，工具才会访问其 Gmail 数据。OAuth 凭据与邮件数据保存在所有者控制的本机环境中，不通过本网站收集、传输或出售。</p>
    </section>
